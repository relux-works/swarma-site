name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (figures ${{ matrix.figures }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, relux-generic]
    strategy:
      fail-fast: false
      matrix:
        figures: ['0', '1']
    env:
      SWARMA_BOOK_FIGURES: ${{ matrix.figures }}
      IDENT_DENY_TOKENS: ${{ secrets.IDENT_DENY_TOKENS }}
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node scripts/run.mjs node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1); console.log(process.version)"
      - run: node scripts/run.mjs npm ci
      - name: Chromium
        run: node scripts/run.mjs node node_modules/playwright/cli.js install chromium
      - name: Checks
        shell: bash
        run: |
          node scripts/run.mjs bash -c '
            if [[ -z "${IDENT_DENY_TOKENS//[[:space:],]/}" ]]; then
              echo "IDENT_DENY_TOKENS must contain a nonempty token list" >&2
              exit 1
            fi
            node scripts/checks/deny-policy.mjs
            npm run check
          '
      - name: Required evidence
        run: node scripts/run.mjs node scripts/checks/ci-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: accessibility-figures-${{ matrix.figures }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .temp/a11y/
            .temp/contrast/
            .temp/product-identity/
            .temp/conventions-evidence.json
            .temp/conventions-a11y-*.json
            .temp/build-regression-evidence.json
