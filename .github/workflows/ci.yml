name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (figures ${{ matrix.figures }})
    runs-on: [self-hosted, swarma-ci]
    strategy:
      fail-fast: false
      matrix:
        figures: ['0', '1']
    env:
      SWARMA_BOOK_FIGURES: ${{ matrix.figures }}
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1); console.log(process.version)"
      - run: npm ci
      - name: Chromium
        run: npx --yes playwright install chromium
      - name: Checks
        shell: bash
        env:
          IDENT_DENY_TOKENS: ${{ secrets.IDENT_DENY_TOKENS }}
        run: |
          node scripts/checks/deny-policy.mjs
          npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-figures-${{ matrix.figures }}
          path: |
            .temp/a11y/
            .temp/conventions-evidence.json
            .temp/conventions-a11y-*.json
            .temp/build-regression-evidence.json
